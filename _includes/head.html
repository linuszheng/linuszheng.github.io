<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script defer src="https://cloud.umami.is/script.js" data-website-id="fe52e582-9b13-459f-8399-a892804bdda2"></script>
  <script>
    // Tag every link so the Umami script records its clicks.
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("a[href]").forEach(function (a) {
        if (a.hasAttribute("data-umami-event")) return;
        a.setAttribute("data-umami-event", a.href.replace(/^https?:\/\//, "").slice(0, 50));      });
    });
  </script>
</head>
